[project]
name = "copse"
version = "0.3.0"
description = "Task worktrees across git repos"
readme = "README.md"
license = "MIT"
authors = [{name = "Ehsanur Rahman Rhythm", email = "errhythm.me@gmail.com"}]
keywords = ["git", "worktree", "cli", "monorepo", "tasks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "questionary>=2.0", "rich>=13"]

[project.urls]
Homepage = "https://github.com/errhythm/copse"
Issues = "https://github.com/errhythm/copse/issues"

[project.scripts]
copse = "copse:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["copse.py"]

[tool.hatch.build.targets.sdist]
include = ["copse.py", "test_*.py", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
